name: Verify and Deploy Sayori Blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Check Sayori Friend Links"]
    types: [completed]

concurrency:
  group: sayori-blog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_VERSION: 4.111.0
  AGE_VERSION: 1.2.1
  AGE_LINUX_AMD64_SHA256: 7df45a6cc87d4da11cc03a539a7470c15b1041ab2b396af088fe9990f7c79d50
  D1_BACKUP_AGE_RECIPIENT: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBpgCenpdj2MdBOx5gBlqCTpGFQ9VttIOhkSqIaS/DFb
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_BROWSER_RENDERING_API_TOKEN: ${{ secrets.CF_BROWSER_RENDERING_API_TOKEN }}
  BLOG_MEDIA_BASE_URL: https://img.sayori.org/blog/v1
  BLOG_MEDIA_REQUIRED: "true"

jobs:
  verify:
    name: verify
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Require main for production events
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_run' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production verification and deploy must run from main."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}

      - name: Checkout public content
        uses: actions/checkout@v6
        with:
          repository: Amiyadesi/sayori-articles
          ref: main
          path: content

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore authorized remote image cache
        uses: actions/cache@v5
        with:
          path: .cache/blog-media/downloads
          key: blog-media-downloads-${{ hashFiles('content/posts/**/*.md', 'content/posts/**/*.mdx') }}
          restore-keys: |
            blog-media-downloads-

      - name: Restore ChKSz metadata cache
        uses: actions/cache@v5
        with:
          path: .cache/chksz-music
          key: chksz-music-${{ hashFiles('content/site/music.json') }}
          restore-keys: |
            chksz-music-

      - name: Record immutable deployment metadata
        shell: bash
        run: |
          echo "DEPLOYMENT_CODE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "DEPLOYMENT_CONTENT_SHA=$(git -C content rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo "DEPLOYMENT_BUILT_AT=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "${GITHUB_ENV}"
          echo "DEPLOYMENT_WORKFLOW_RUN=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "${GITHUB_ENV}"

      - name: Check production secrets
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BLOG_MEDIA_CF_API_TOKEN: ${{ secrets.BLOG_MEDIA_CF_API_TOKEN }}
        run: |
          missing=0
          for name in \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            CF_BROWSER_RENDERING_API_TOKEN \
            BLOG_MEDIA_CF_API_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Prepare optimized blog media
        env:
          CONTENT_DIR: ./content
          BLOG_MEDIA_UPLOAD: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          BLOG_MEDIA_VERIFY_REMOTE: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          BLOG_MEDIA_CF_API_TOKEN: ${{ secrets.BLOG_MEDIA_CF_API_TOKEN }}
        run: pnpm run prepare-media

      - name: Enrich music metadata when ChKSz is configured
        env:
          CONTENT_DIR: ./content
          CHKSZ_API_KEY: ${{ secrets.CHKSZ_API_KEY }}
          CHKSZ_CACHE_DIR: .cache/chksz-music
          CHKSZ_MUSIC_WRITE: "true"
          CHKSZ_MUSIC_MAX_REQUESTS: "20"
        run: pnpm run enrich-music

      - name: Sync public content
        env:
          CONTENT_DIR: ./content
        run: pnpm run sync-content

      - name: Run Node tests
        run: pnpm test

      - name: Check and build
        env:
          CONTENT_DIR: ./content
        run: |
          pnpm run check
          pnpm run build
          pnpm run verify-build-output
          node scripts/write-deployment-manifest.mjs dist/deployment.json

      - name: Detect pending D1 migrations
        id: d1_migrations
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm dlx "wrangler@${WRANGLER_VERSION}" d1 migrations list sayori-analytics --remote 2>&1)"
          printf '%s\n' "${output}"
          if grep -Fq 'No migrations to apply!' <<< "${output}"; then
            echo 'pending=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'pending=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Export and encrypt D1 before migration
        if: github.event_name != 'pull_request' && steps.d1_migrations.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSL \
            --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz" \
            -o "${archive}"
          echo "${AGE_LINUX_AMD64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"

          backup_dir="${RUNNER_TEMP}/d1-backup"
          mkdir -m 0700 "${backup_dir}"
          backup="${backup_dir}/sayori-analytics-${GITHUB_RUN_ID}-${GITHUB_SHA}.sql"
          encrypted="${backup}.age"
          pnpm dlx "wrangler@${WRANGLER_VERSION}" d1 export sayori-analytics \
            --remote \
            --skip-confirmation \
            --output "${backup}"
          "${RUNNER_TEMP}/age/age" --encrypt \
            --recipient "${D1_BACKUP_AGE_RECIPIENT}" \
            --output "${encrypted}" \
            "${backup}"
          (
            cd "${backup_dir}"
            sha256sum "$(basename "${encrypted}")" > "$(basename "${encrypted}").sha256"
          )
          rm -f "${backup}"
          test -s "${encrypted}"
          test -s "${encrypted}.sha256"

      - name: Upload encrypted D1 backup to GitHub
        if: github.event_name != 'pull_request' && steps.d1_migrations.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sayori-analytics-pre-migration-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/d1-backup/*.age
            ${{ runner.temp }}/d1-backup/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request' && steps.d1_migrations.outputs.pending == 'true'
        run: pnpm dlx "wrangler@${WRANGLER_VERSION}" d1 migrations apply sayori-analytics --remote

      - name: Configure screenshot secret
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          secret_file="${RUNNER_TEMP}/sayori-blog-pages-secrets.json"
          node --input-type=module - "${secret_file}" <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync(process.argv[2], JSON.stringify({
            CF_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            CF_API_TOKEN: process.env.CF_BROWSER_RENDERING_API_TOKEN,
          }), { mode: 0o600 });
          NODE
          pnpm dlx "wrangler@${WRANGLER_VERSION}" pages secret bulk "${secret_file}" --project-name sayori-blog
          rm -f "${secret_file}"

      - name: Deploy Pages
        if: github.event_name != 'pull_request'
        run: >
          pnpm dlx "wrangler@${WRANGLER_VERSION}" pages deploy dist
          --project-name sayori-blog
          --branch main
          --commit-hash "${DEPLOYMENT_CODE_SHA}"
          --commit-message "Deploy blog.sayori.org from GitHub Actions"

      - name: Verify custom domain
        if: github.event_name != 'pull_request'
        run: node scripts/verify-live-deployment.mjs https://blog.sayori.org

      - name: Submit sitemap URLs to IndexNow when configured
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          INDEXNOW_HOST: blog.sayori.org
        run: |
          if [[ -z "${INDEXNOW_KEY}" ]]; then
            echo "INDEXNOW_KEY is not configured; skipping IndexNow submission."
            exit 0
          fi
          pnpm run submit
